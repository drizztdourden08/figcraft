[package]
name = "figcraft-collab-seal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft sealed (end-to-end encrypted) files: file keys and their subkeys, sealing and opening values, entry name hiding, padding, device keys, key wrapping, link keys and recovery keys (pure crypto and data, no I/O)"

[lints]
workspace = true

[dependencies]
figcraft-collab = { workspace = true }
figcraft-doc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
data-encoding = "2"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"
sha2 = { version = "0.11", default-features = false }
hmac = "0.13"
hkdf = "0.13"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
# RFC 9180 HPKE (DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, ChaCha20-Poly1305) for wrapping file keys to devices.
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha"] }

# The browser build: getrandom reads `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
postcard = { workspace = true }
